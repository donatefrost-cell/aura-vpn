name: CI & Release Build (AURA VPN)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    name: Secret Scan & RustSec Advisory Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      security-events: write
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: RustSec advisory audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  verify:
    name: Lint, Test & Build Gate (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Install npm dependencies
        run: npm ci

      - name: Provision & verify pinned core binaries (SHA-256 + Wintun Authenticode)
        run: npm run download-core

      - name: Frontend checks (Vitest, TypeScript, Vite build)
        run: |
          npm run test
          npx tsc --noEmit
          npm run build

      - name: Verify no preview mock chunk leaked into production dist
        shell: pwsh
        run: |
          $leaked = Get-ChildItem "dist/assets" -Filter "previewApi*" -ErrorAction SilentlyContinue
          if ($leaked) {
            throw "Mock previewApi chunk found in production build: $($leaked.Name -join ', ')"
          }

      - name: Rust formatting, Clippy & tests (with UAC manifest)
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -W clippy::all -D warnings
          cargo test --lib --locked --no-run
          $exe = Get-ChildItem "target/debug/deps/aura_vpn_lib-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $kit = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if ($exe -and $kit) {
            & $kit.FullName -manifest "tests.manifest" "-outputresource:$($exe.FullName);1"
            & $exe.FullName --test-threads=1
          } else {
            cargo test --lib --locked -- --test-threads=1
          }

      - name: Dependency audit (npm high/critical)
        run: npm audit --audit-level=high

      - name: Generate CycloneDX 1.5 SBOM
        run: npm run sbom

  release-build:
    name: Build Windows Installer & Attest Provenance
    needs: [verify, security-audit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install npm dependencies
        run: npm ci

      - name: Provision & verify pinned core binaries
        run: npm run download-core

      - name: Generate CycloneDX 1.5 SBOM
        run: npm run sbom

      - name: Build Tauri NSIS Installer
        run: npm run tauri build

      - name: Optional Authenticode Code Signing (when certificate secret is configured)
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_BASE64)) {
            Write-Host "No Authenticode certificate configured; skipping code signing."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $targets = @(
            "src-tauri/target/release/aura-vpn.exe",
            (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          )
          foreach ($target in $targets) {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfxPath /p $env:WINDOWS_SIGN_CERT_PASSWORD $target
          }
          Remove-Item $pfxPath -Force

      - name: Stage release bundle, SHA256SUMS.txt & SBOM.json
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-dist" | Out-Null
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $nsis.FullName "release-dist/$($nsis.Name)"
          Copy-Item "SBOM.json" "release-dist/SBOM.json"
          $installerHash = (Get-FileHash "release-dist/$($nsis.Name)" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sbomHash = (Get-FileHash "release-dist/SBOM.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$installerHash  $($nsis.Name)",
            "$sbomHash  SBOM.json"
          ) | Out-File -Encoding ascii "release-dist/SHA256SUMS.txt"

      - name: Generate GitHub Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-dist/*.exe
            release-dist/SBOM.json
            release-dist/SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-vpn-windows-x64-${{ github.ref_name }}
          path: release-dist/*

      - name: Publish GitHub Release (idempotent for pre-published tags)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; skipping creation."
            exit 0
          fi
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            release-dist/* \
            --title "AURA VPN ${{ github.ref_name }}" \
            --generate-notes \
            ${PRERELEASE_FLAG}
